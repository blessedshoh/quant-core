# The pricing API on Fly.io. Deploy from this folder:  fly deploy --remote-only
app = "blessedshoh-api"
primary_region = "sin"

[build]
  dockerfile = "api/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # When idle the machine is suspended: it costs only its disk, and the next
  # request resumes it in a few hundred milliseconds instead of a cold start.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
