[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcore"
version = "0.1.0"
description = "Option pricing and risk: Black-Scholes prices, Greeks, multi-leg positions and P/L grids."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]
crosscheck = ["QuantLib>=1.34"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
notebooks = ["nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "edge: edge cases (expiry, zero volatility, bad inputs). Skip with -m 'not edge' while learning.",
]
